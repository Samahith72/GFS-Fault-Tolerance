version: "3.9"

services:

  master:
    build: .
    container_name: master
    command: python -m master.master
    ports:
      - "5050:5050"

  node1:
    build: .
    container_name: node1
    command: python -m chunkserver.chunkserver --id 1
    environment:
      - MASTER_ADDRESS=master:5050
    depends_on:
      - master
    ports:
      - "5001:5001"

  node2:
    build: .
    container_name: node2
    command: python -m chunkserver.chunkserver --id 2
    environment:
      - MASTER_ADDRESS=master:5050
    depends_on:
      - master
    ports:
      - "5002:5002"

  node3:
    build: .
    container_name: node3
    command: python -m chunkserver.chunkserver --id 3
    environment:
      - MASTER_ADDRESS=master:5050
    depends_on:
      - master
    ports:
      - "5003:5003"